services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_room_booking}
    ports:
      # Bound to localhost only: this container ships with weak default
      # credentials meant for local development, not a publicly reachable
      # port.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-meeting_room_booking}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
